spring:
  application:
    name: pawlingo-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pawlingo}
    username: ${DB_USERNAME:pawlingo}
    password: ${DB_PASSWORD:pawlingo}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
